:root{--ink:#1d2733;--navy:#1f3a5f;--line:#cfd6df;--bg:#f3f5f8;--soft:#e8edf4;--red:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
#app{max-width:760px;margin:0 auto;padding:12px 12px 90px}
body.preview-mode #app{max-width:1200px}
h1{margin:0;font-size:26px}h2{font-size:18px;margin:14px 0 10px;color:var(--navy)}h3{margin:0 0 6px;font-size:16px}
a{color:var(--navy);text-decoration:none}
.hero{text-align:center;padding:26px 0 14px;color:var(--navy)}.hero p{margin:4px 0 0;color:#566}
.crumbs{font-size:13px;color:#667;padding:6px 2px;overflow-x:auto;white-space:nowrap}
.muted{color:#667}.small{font-size:12px}.center{text-align:center}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.warn{background:#fff4e5;border:1px solid #f0c27b;border-radius:8px;padding:10px;margin:10px 0}
.bigcard{display:flex;gap:14px;align-items:center;background:var(--navy);color:#fff;border-radius:12px;padding:18px;margin:12px 0}
.bigcard .ic{font-size:34px}.bigcard b{display:block;font-size:18px}.bigcard small{opacity:.85}
.item,.mcard{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0}
